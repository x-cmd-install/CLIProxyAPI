unt":50,"created_at":"2026-11-27T14:59:15Z","updated_at":"2026-11-27T14:59:17Z"},{"id":800913408,"node_id":"RA_kwDOPFM7E84vvPgA","name":"CLIProxyAPI_8.1.8_linux_amd64.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":27353679,"digest":"sha256:3043da238fe86cd336dc8d30eed727a0ce3e0d30c7f9ee014a50576b2f11c6c8","download_count":1934,"created_at":"2026-11-27T14:59:46Z","updated_at":"2026-11-27T14:59:47Z"},{"id":800911054,"node_id":"RA_kwDOPFM7E84vvO7O","name":"CLIProxyAPI_8.1.8_linux_amd64_no-plugin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":27210540,"digest":"sha256:4b43724a787d24f01fb09bde8e6b2374a42b167eb9a79208acd32b44977039b7","download_count":153,"created_at":"2026-11-27T14:59:10Z","updated_at":"2026-11-27T14:59:11Z"},{"id":800918740,"node_id":"RA_kwDOPFM7E84vvQzU","name":"CLIProxyAPI_8.1.8_windows_aarch64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":24645573,"digest":"sha256:8fdbe4c961292304cd30bfa9fc0edf097ac69dc03d80b07cd7da13a71de4bf5e","download_count":32,"created_at":"2026-11-27T15:01:23Z","updated_at":"2026-11-27T15:01:25Z"},{"id":800915372,"node_id":"RA_kwDOPFM7E84vvP-s","name":"CLIProxyAPI_8.1.8_windows_amd64.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":27645560,"digest":"sha256:78fefd68b21400da168c1f647a4679b3e4896a0165addca92e1d589e926e568b","download_count":1036,"created_at":"2026-11-27T15:00:21Z","updated_at":"2026-11-27T15:00:22Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- test(auth): run session cache TTL refresh checks on virtual time (e1e87409)\n- fix(registry): isolate empty model header overrides (402d4586)\n- fix(codex): fail over in-stream billing quota errors during bootstrap buffering (b2e33162)\n- fix(auth): reconcile disabled-era and orphaned unavailable flags (42b13fff)\n- fix(translator): group and align split Gemini functionResponse turns (13e06420)\n- Merge pull request #5689 from cookerpapa/test/session-cache-virtual-time (e3795562)\n- Merge pull request #5698 from cookerpapa/fix/model-header-snapshot (91619936)\n- fix(util): strip empty, whitespace-only, and null enum values in Gemini schema cleaners (#8571) (54ed2ba2)\n- fix(auth): write auth files atomically via temp file, sync, and rename (6021aba9)\n- feat(pluginhost,auth): propagate request cancellation to scheduler.pick plugins (7b4b3503)\n- test(cliproxy): unregister snapshot test auths from global model registry (1cf870b4)\n- fix(auth,cliproxy): wait for in-flight auto-refresh saves during shutdown (32c0c459)\n- fix(gemini): emit Google RPC APIError JSON for post-commit SSE stream errors (249ea68d)\n- perf(antigravity): reduce allocations when normalizing Gemini tool responses (66f3ad17)\n- fix(auth): release active credential_quota cooldown on completed operator verify (37caab7d)\n- fix(cliproxy): validate absent auth file snapshots under mutation lock (ee8b3f0c)\n- fix(watcher): keep watching config.yaml across atomic rename replacements (dbe641f2)\n\n\n## What's Changed\n* test(auth): use virtual time for session cache TTL refresh by @cookerpapa in https://github.com/router-for-me/CLIProxyAPI/pull/5689\n* fix(registry): isolate empty model header overrides by @cookerpapa in https://github.com/router-for-me/CLIProxyAPI/pull/5698\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v8.1.7...v8.1.8\n","reactions":{"total_count":4,"+1":4,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":1}
