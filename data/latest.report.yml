":"sha256:763f91711d0891d681763ec320b1c3d475642f6202bd45a9c7bf34ee59aa9d27","download_count":48,"created_at":"2026-09-10T02:43:59Z","updated_at":"2026-09-10T02:44:01Z"}],"body":"<!-- cliproxyapi-linux-release-assets:start -->\n## Linux release assets\n\n- `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.\n- `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.\n\n## FreeBSD release assets\n\n- `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.\n\n<!-- cliproxyapi-linux-release-assets:end -->\n\n## Changelog\n\n- feat(plugin): add host session affinity lookup callback (0796d6d1)\n- fix(claude): emit trailing usage chunk and aggregate stream usage (a59b1764)\n- feat(codex): support model-level quota cooling (b064b832)\n- fix(translator): strip unsupported unicode property escape patterns from tool schemas (e56abd56)\n- fix(schema): inspect patternProperties keys and avoid Unicode escape fast-path bypass (37ce368c)\n- Merge pull request #5677 from sususu98/fix/codex-tool-schema-pattern (db011593)\n- feat(management): add endpoint to refresh auth files (60e5b8bd)\n- feat(auth): propagate canonical session id for custom header expansion (3bf787fc)\n- fix(auth): classify terminal upstream auth failures as non-retryable errors (aedc9e6a)\n- feat(codex): add support for gpt-image-2.5 models (d1a024e9)\n\n\n## What's Changed\n* fix(translator): strip unsupported unicode property escape patterns from tool schemas by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5677\n\n\n**Full Changelog**: https://github.com/router-for-me/CLIProxyAPI/compare/v7.2.155...v7.2.156\n","mentions_count":1}
